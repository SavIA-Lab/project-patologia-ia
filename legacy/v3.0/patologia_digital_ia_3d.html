<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patología Digital &amp; IA — Laboratorio Interactivo 3D (v3.0)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234C3A7A'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23C95B82'/%3E%3C/svg%3E">

<!-- El importmap debe preceder a cualquier otro script -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root{
  --bg:#F8FAFC; --panel:#FFFFFF; --line:#E2E8F0; --ink:#0F172A; --ink2:#475569; --ink3:#94A3B8;
  --hema:#4C3A7A; --eosin:#C95B82; --teal:#0F766E; --amber:#D97706; --crimson:#BE123C;
  --vp:#F1F5F9; --soft:#F1F5F9;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ---------- Header ---------- */
#topbar{background:var(--panel);border-bottom:1px solid var(--line);flex:none;z-index:30}
.top-row{display:flex;align-items:center;gap:16px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0;margin-right:auto}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--hema);position:relative;flex:none}
.brand-mark::after{content:"";position:absolute;left:9px;top:9px;width:16px;height:16px;border-radius:50%;background:var(--eosin)}
.brand h1{font-size:16px;font-weight:700;margin:0;letter-spacing:-0.01em;line-height:1.2}
.brand p{margin:0;font-size:11px;color:var(--ink2)}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.active{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.12),0 0 0 1px var(--line)}
.seg button.active[data-value="he"]{color:var(--hema)}
.seg button.active[data-value="pap"]{color:var(--teal)}
.seg button.active[data-value="ihc"]{color:#92400E}
.top-actions{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:600;transition:background .15s,border-color .15s}
.btn:hover{background:var(--soft);border-color:#CBD5E1}
.btn-primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn-primary:hover{background:#0B5F58;border-color:#0B5F58}
.btn-hema{background:var(--hema);border-color:var(--hema);color:#fff}
.btn-hema:hover{background:#3C2D63;border-color:#3C2D63}
.btn-danger{background:var(--crimson);border-color:var(--crimson);color:#fff}
.btn-danger:hover{background:#9F0F31}
.btn-sm{padding:5px 9px;font-size:11.5px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.stage-row{display:flex;gap:0;padding:0 12px;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.stage-btn{flex:1 1 0;min-width:150px;display:flex;align-items:center;gap:9px;border:0;background:transparent;padding:9px 12px;font-size:12.5px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;text-align:left;white-space:nowrap}
.stage-btn .num{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ink3);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--ink2);flex:none}
.stage-btn:hover{background:var(--soft);color:var(--ink)}
.stage-btn.active{color:var(--ink);border-bottom-color:var(--teal);background:#F0FDFA}
.stage-btn.active .num{background:var(--teal);border-color:var(--teal);color:#fff}
#btn-panel{display:none}

/* ---------- Main ---------- */
#main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,68fr) minmax(340px,32fr)}
#main.sidebar-collapsed{grid-template-columns:minmax(0,1fr)}
#main.sidebar-collapsed #editorial-sidebar{display:none}
#viewport{position:relative;background:#F1F5F9;min-height:0;min-width:0;overflow:hidden}
#gl-host{position:absolute;inset:0}
#gl-host canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
#editorial-sidebar{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-height:0;padding:18px 18px 40px}

/* ---------- Overlays del viewport ---------- */
.float-card{position:absolute;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 3px rgba(15,23,42,.08);backdrop-filter:blur(2px)}
#cam-controls{left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;padding:6px;align-items:center;z-index:5}
#cam-controls .btn{padding:6px 11px}
#stage-badge{right:12px;top:12px;padding:6px 10px;font-size:11px;color:var(--ink2);z-index:4;pointer-events:none}
#legend{left:12px;bottom:14px;padding:10px 12px;max-width:250px;font-size:11.5px;z-index:4}
#legend h4{margin:0 0 6px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.lg-row{display:flex;align-items:center;gap:8px;margin:3px 0;color:var(--ink)}
.lg-dot{width:10px;height:10px;border-radius:50%;flex:none;border:1px solid rgba(15,23,42,.15)}
.lg-sq{width:12px;height:10px;border-radius:2px;flex:none;border:1px solid rgba(15,23,42,.15)}
.lg-ramp{height:8px;border-radius:4px;margin:4px 0 2px;width:100%}
#trace-hud{left:12px;top:12px;width:268px;padding:10px;z-index:6;display:none}
#trace-hud.show{display:block}
#trace-hud .hud-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#trace-hud .hud-title{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--hema)}
.hud-body{display:flex;gap:10px}
.hud-thumb{width:72px;height:72px;border-radius:6px;border:1px solid var(--line);flex:none;object-fit:cover;background:#fff;image-rendering:auto}
.hud-info{font-size:11.5px;line-height:1.4;min-width:0}
.hud-info .k{color:var(--ink2)}
.hud-state{margin-top:8px;padding:6px 8px;border-radius:6px;background:var(--soft);font-size:11.5px;border-left:3px solid var(--teal)}
.hud-state.warn{border-left-color:var(--amber);background:#FFFBEB}
.hud-state.bad{border-left-color:var(--crimson);background:#FFF1F2}
.hud-links{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.hud-links button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px;font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--ink2)}
.hud-links button:hover{background:var(--soft)}
.hud-links button.cur{background:var(--teal);color:#fff;border-color:var(--teal)}
#challenge-banner{left:50%;top:12px;transform:translateX(-50%);padding:10px 14px;z-index:7;display:none;max-width:min(520px,calc(100% - 24px));border-color:#FDE68A;background:rgba(255,251,235,.96)}
#challenge-banner.show{display:block}
#challenge-banner b{color:var(--amber)}
#tooltip{position:absolute;pointer-events:none;z-index:20;background:rgba(15,23,42,.94);color:#F8FAFC;font-size:11.5px;line-height:1.45;padding:7px 10px;border-radius:7px;max-width:260px;display:none;box-shadow:0 4px 14px rgba(15,23,42,.25)}
#tooltip .tt-t{font-weight:600;margin-bottom:2px}
#tooltip .tt-r{display:flex;justify-content:space-between;gap:14px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#CBD5E1}
#tooltip .tt-r b{color:#fff;font-weight:500}
#toast{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:7px 14px;border-radius:8px;font-size:12px;z-index:25;opacity:0;pointer-events:none;transition:opacity .25s;max-width:calc(100% - 30px);text-align:center}
#toast.show{opacity:.96}
#fatal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:30px;text-align:center;color:var(--ink2);background:#F1F5F9;z-index:30}
#fatal.show{display:flex}

/* ---------- Sidebar editorial ---------- */
.kicker{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:600}
.stage-title{font-size:21px;line-height:1.2;font-weight:700;margin:4px 0 4px;letter-spacing:-0.015em}
.stage-sub{font-size:13px;color:var(--ink2);margin:0 0 12px}
.mod-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid var(--line);background:var(--soft);color:var(--ink2);margin-bottom:10px}
.mod-pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.prose p{margin:0 0 10px;color:#1E293B;font-size:13.5px}
.prose p b{font-weight:600}
.sec{margin-top:18px}
.sec>h3{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);font-weight:700;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.sec>h3::after{content:"";flex:1;height:1px;background:var(--line)}
.math-box{border:1px solid var(--line);border-left:3px solid var(--hema);background:#FAFAFD;border-radius:8px;padding:10px 12px;font-family:'Times New Roman',Georgia,serif;font-size:15px;line-height:1.9;color:#1E1B3A;overflow-x:auto}
.math-box .ln{display:block;white-space:normal;overflow-wrap:break-word}
.math-var{font-style:italic;font-family:'Times New Roman',Georgia,serif}
.math-vec{font-weight:700;font-style:normal;font-family:'Times New Roman',Georgia,serif}
.math-box sub,.math-box sup{font-size:.7em;line-height:0}
.math-note{display:block;font-family:'Inter',sans-serif;font-size:11.5px;color:var(--ink2);margin-top:4px;line-height:1.45}
.ctl{margin-top:10px}
.ctl-label{font-size:12px;font-weight:600;color:var(--ink);margin-bottom:5px;display:flex;justify-content:space-between;align-items:center}
.seg-sm{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg-sm button{flex:1 1 auto;border:0;background:transparent;padding:6px 8px;border-radius:6px;font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg-sm button:hover{color:var(--ink)}
.seg-sm button.active{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.12),0 0 0 1px var(--line)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.toggle-row:last-child{border-bottom:0}
.toggle-row span{font-size:12.5px;line-height:1.35}
.toggle-row span b{font-weight:600;display:block}
.toggle-row span em{font-style:normal;color:var(--ink2);font-size:11.5px}
.switch{appearance:none;-webkit-appearance:none;width:36px;height:20px;border-radius:99px;background:#CBD5E1;position:relative;flex:none;cursor:pointer;transition:background .15s;margin:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.3);transition:transform .15s}
.switch:checked{background:var(--teal)}
.switch:checked::after{transform:translateX(16px)}
.switch.sw-amber:checked{background:var(--amber)}
.switch.sw-crimson:checked{background:var(--crimson)}
input[type=range]{width:100%;accent-color:var(--teal);margin:2px 0}
.val{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink);font-weight:500}
.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.metric-grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.metric{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
.metric .ml{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.metric .mv{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:600;margin-top:1px;color:var(--ink)}
.metric .ms{font-size:11px;color:var(--ink2)}
.metric.good .mv{color:var(--teal)} .metric.warn .mv{color:var(--amber)} .metric.bad .mv{color:var(--crimson)}
.bar-row{margin:8px 0}
.bar-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.bar-head b{font-weight:600}
.bar-track{height:9px;border-radius:5px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.bar-fill{height:100%;border-radius:5px;transition:width .35s ease;background:var(--teal)}
.bar-fill.hema{background:var(--hema)} .bar-fill.eosin{background:var(--eosin)} .bar-fill.amber{background:var(--amber)} .bar-fill.crimson{background:var(--crimson)}
.canvas-frame{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.canvas-frame canvas{display:block;width:100%;height:auto}
.canvas-cap{font-size:11px;color:var(--ink2);padding:5px 8px;border-top:1px solid var(--line);background:#FAFBFC;display:flex;justify-content:space-between;gap:8px}
.thumb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thumb-grid figure{margin:0;text-align:center}
.thumb-grid canvas{width:100%;height:auto;aspect-ratio:1/1;border-radius:6px;border:1px solid var(--line);display:block}
.thumb-grid figcaption{font-size:11px;color:var(--ink2);margin-top:3px;line-height:1.3}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);font-weight:600}
.tbl td{padding:7px 6px;border-bottom:1px solid var(--line);font-family:'JetBrains Mono',monospace;font-size:12px}
.tbl td:first-child{font-family:'Inter',sans-serif;font-weight:600}
.tbl tr.act{background:#F0FDFA}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;border:1px solid transparent}
.chip.VP,.chip.VN,.chip.ok{background:#CCFBF1;color:#0F766E;border-color:#99F6E4}
.chip.FN,.chip.FP,.chip.bad{background:#FFE4E6;color:#BE123C;border-color:#FECDD3}
.chip.warn{background:#FEF3C7;color:#B45309;border-color:#FDE68A}
.note{font-size:12px;color:var(--ink2);background:var(--soft);border-radius:8px;padding:8px 10px;margin-top:8px;line-height:1.45}
.note.warn{background:#FFFBEB;color:#92400E;border:1px solid #FDE68A}
.note.bad{background:#FFF1F2;color:#9F1239;border:1px solid #FECDD3}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.top3{display:grid;gap:8px}
.top3-card{display:flex;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff;text-align:left;width:100%}
.top3-card:hover{border-color:var(--eosin);background:#FFF8FA}
.top3-card.sel{border-color:var(--crimson);box-shadow:0 0 0 2px rgba(190,18,60,.15)}
.top3-card canvas{width:76px;height:76px;border-radius:6px;border:1px solid var(--line);flex:none}
.top3-card .t3-i{font-size:12px;min-width:0}
.top3-card .t3-r{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink2)}
.top3-card .t3-h{font-weight:700;font-size:12.5px}
.pin-list{margin:8px 0 0;padding:0;list-style:none;font-size:12px}
.pin-list li{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line)}
.score-big{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:600}
.cm{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px;font-size:12px;margin-top:6px}
.cm div{padding:6px 8px;border-radius:6px;text-align:center;font-family:'JetBrains Mono',monospace}
.cm .h{background:transparent;color:var(--ink2);font-family:'Inter',sans-serif;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.cm .tp,.cm .tn{background:#CCFBF1;color:#0F766E} .cm .fp,.cm .fn{background:#FFE4E6;color:#BE123C}
.foot{margin-top:22px;padding-top:12px;border-top:1px solid var(--line);font-size:11px;color:var(--ink3)}

/* ---------- Quiz ---------- */
#quiz-modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
#quiz-modal.show{display:flex}
.quiz-card{background:#fff;border-radius:14px;width:min(640px,100%);max-height:calc(100dvh - 32px);overflow-y:auto;padding:22px 24px;box-shadow:0 20px 50px rgba(15,23,42,.3)}
.quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.quiz-prog{height:6px;border-radius:4px;background:var(--soft);overflow:hidden;margin-bottom:16px}
.quiz-prog>div{height:100%;background:var(--teal);transition:width .3s}
.quiz-q{font-size:16.5px;font-weight:600;line-height:1.4;margin:0 0 14px}
.quiz-opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:10px 12px;margin-bottom:8px;font-size:13.5px;color:var(--ink);line-height:1.4}
.quiz-opt:hover:not([disabled]){border-color:var(--hema);background:#FAFAFD}
.quiz-opt .lt{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink3);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:none;font-family:'JetBrains Mono',monospace}
.quiz-opt.ok{border-color:var(--teal);background:#F0FDFA}
.quiz-opt.ok .lt{background:var(--teal);border-color:var(--teal);color:#fff}
.quiz-opt.no{border-color:var(--crimson);background:#FFF1F2}
.quiz-opt.no .lt{background:var(--crimson);border-color:var(--crimson);color:#fff}
.quiz-opt[disabled]{cursor:default}
.quiz-fb{border-radius:9px;padding:10px 12px;font-size:13px;margin-top:6px;line-height:1.5}
.quiz-fb.ok{background:#F0FDFA;border:1px solid #99F6E4;color:#134E4A}
.quiz-fb.no{background:#FFF1F2;border:1px solid #FECDD3;color:#881337}
.quiz-nav{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px}

/* ---------- Responsive ---------- */
@media (max-width:980px){
  body{overflow:auto}
  #app{height:auto;min-height:100dvh}
  #main{display:block}
  #viewport{height:64vh;min-height:380px}
  #editorial-sidebar{overflow:visible;border-left:0;border-top:1px solid var(--line)}
  #main.sidebar-collapsed #editorial-sidebar{display:none}
  #btn-panel{display:inline-flex}
  #legend{display:none}
  #trace-hud{width:230px}
  .brand p{display:none}
}
@media (max-width:560px){
  .top-row{gap:8px;padding:8px 10px}
  .seg button{padding:6px 8px;font-size:12px}
  .brand h1{font-size:13.5px}
  .stage-btn{min-width:130px}
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="top-row">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <h1>Patología Digital &amp; IA — Laboratorio 3D</h1>
          <p class="mono">v3.0 · WSI → QC → Encoder → MIL → XAI</p>
        </div>
      </div>
      <div class="seg" id="modality-seg" role="group" aria-label="Modalidad y tinción">
        <button type="button" data-set="modality" data-value="he">Biopsia H&amp;E</button>
        <button type="button" data-set="modality" data-value="pap">Citología Pap</button>
        <button type="button" data-set="modality" data-value="ihc">IHC (DAB)</button>
      </div>

function tissueMask(u, v, mod) {
  const m = MODALITIES[mod];
  const dx = (u - 0.5) / 0.485, dy = (v - 0.5) / 0.47;
  const r = Math.sqrt(dx * dx + dy * dy);
  const n = fbm(u * 4.2, v * 2.6, m.maskSeed, 3);
  if (mod === 'pap') {
    const cloud = fbm(u * 6.5 + 3.1, v * 3.4 + 1.7, m.maskSeed + 5, 3);
    const sparse = smoothstep(0.44, 0.70, cloud);
    const edge = 1 - smoothstep(0.82, 1.0, r + 0.18 * (n - 0.5));
    return clamp(0.05 + 0.80 * sparse) * edge;

  return clamp(edge * inner);
}
function focusEnv(u, v, f, k = 1.3) {
  const du = (u - f.u) / f.rx, dv = (v - f.v) / f.ry;
  return Math.exp(-k * (du * du + dv * dv));
}
/** Devuelve cobertura de tejido, puntuación de atipia y clúster morfológico en (u,v) */
function evaluateBiologicalSignals(u, v, modality) {
  const m = MODALITIES[modality];
  let cov = tissueMask(u, v, modality);
  const g = Math.max(focusEnv(u, v, m.primaryFocus), 0.88 * focusEnv(u, v, m.secondaryFocus));
  if (modality === 'pap') cov = Math.max(cov, 0.78 * g);
  const tex = fbm(u * 14, v * 8, m.maskSeed + 31, 2);
  let atyp = Math.max(g * (0.85 + 0.3 * tex), 0.03 + 0.06 * tex);
  atyp = clamp(atyp * smoothstep(0.05, 0.35, cov));
  let idx = -1;
  if (cov >= m.bgThreshold) {
    if (atyp > 0.45) idx = 3;
    else {
      const n2 = vnoise(u * 10, v * 5, m.maskSeed + 51);
      idx = n2 < 0.46 ? 0 : (n2 < 0.80 ? 1 : 2);
      if (atyp > 0.2 && n2 > 0.55) idx = 2;
    }
  }
  return { tissueCoverage: cov, atypiaScore: atyp, clusterKey: idx >= 0 ? m.clusters[idx].key : null, clusterIndex: idx };
}

const ARTIFACTS = {
  blur:    { key: 'blur',    label: 'Desenfoque óptico',          cu: 0.20, cv: 0.30, rx: 0.11, ry: 0.18 },
  folds:   { key: 'folds',   label: 'Pliegues / Acúmulos',        a: [0.42, 0.86], b: [0.78, 0.66], w: 0.05 },
  ink:     { key: 'ink',     label: 'Tinta de marcador',          a: [0.90, 0.08], b: [0.93, 0.74], w: 0.022 },

};
function distSeg(px, py, ax, ay, bx, by) {
  const abx = bx - ax, aby = by - ay;
  const t = clamp(((px - ax) * abx + (py - ay) * aby) / (abx * abx + aby * aby));
  return Math.hypot(ax + t * abx - px, ay + t * aby - py);
}
/** Evalúa la intensidad (0–1) de cada artefacto activo en (u,v). Las distancias se calculan en unidades isotrópicas (u·2, v). */
function evaluateArtifactAt(u, v, active) {
  const out = { blur: 0, folds: 0, ink: 0, bubbles: 0 };
  if (active.blur) {
    const A = ARTIFACTS.blur;
    out.blur = 1 - smoothstep(0.7, 1.0, Math.hypot((u - A.cu) / A.rx, (v - A.cv) / A.ry));
  }
  if (active.folds) {
    const A = ARTIFACTS.folds;
    out.folds = 1 - smoothstep(A.w * 0.5, A.w * 1.1, distSeg(u * 2, v, A.a[0] * 2, A.a[1], A.b[0] * 2, A.b[1]));
  }
  if (active.ink) {
    const A = ARTIFACTS.ink;
    out.ink = 1 - smoothstep(A.w * 0.5, A.w * 1.1, distSeg(u * 2, v, A.a[0] * 2, A.a[1], A.b[0] * 2, A.b[1]));
  }
  if (active.bubbles) {
    let best = 0;
    for (const c of ARTIFACTS.bubbles.circles) {
      best = Math.max(best, 1 - smoothstep(c[2] * 0.8, c[2] * 1.1, Math.hypot((u - c[0]) * 2, v - c[1])));
    }
    out.bubbles = best;
  }
  return out;
}

/** Evalúa una teselas (col,row) de una grilla cols×rows: cobertura, atipia, varianza Laplaciana simulada y banderas de artefacto */
function evalTile(col, row, cols, rows) {
  const mod = state.modality, M = MODALITIES[mod];
  const u0 = col / cols, u1 = (col + 1) / cols, v0 = row / rows, v1 = (row + 1) / rows;
  const K = 5; let cov = 0, aty = 0, blurMean = 0, n = 0;
  const cnt = { blur: 0, folds: 0, ink: 0, bubbles: 0 };
  let clusterVotes = [0, 0, 0, 0];
  for (let j = 0; j < K; j++) for (let i = 0; i < K; i++) {
    const u = lerp(u0, u1, (i + 0.5) / K), v = lerp(v0, v1, (j + 0.5) / K);
    const s = evaluateBiologicalSignals(u, v, mod);
    cov += s.tissueCoverage; aty += s.atypiaScore;
    if (s.clusterIndex >= 0) clusterVotes[s.clusterIndex]++;
    const a = evaluateArtifactAt(u, v, state.artifacts);
    blurMean += a.blur;
    for (const k of ARTIFACT_KEYS) if (a[k] > 0.5) cnt[k]++;
    n++;
  }
  cov /= n; aty /= n; blurMean /= n;
  const bg = cov < M.bgThreshold;
  const h = hash2(col, row, cols * 31 + M.maskSeed);
  let lap;
  if (bg) lap = 4 + h * 7;
  else {
    const base = 150 + h * 190 * (0.6 + 0.4 * cov);
    lap = Math.max(3, base * Math.pow(1 - clamp(blurMean), 2.5)) + (cnt.folds / n) * 40 + (cnt.ink / n) * 25;
  }
  const flags = {
    blur: !bg && blurMean > 0.12 && lap < QC_LAPLACIAN_MIN,
    folds: cnt.folds / n >= 0.2,
    ink: cnt.ink / n >= 0.12,
    bubbles: cnt.bubbles / n >= 0.25
  };
  const hasArtifact = !bg && ARTIFACT_KEYS.some(k => flags[k]);
  const tileType = bg ? 'fondo' : (hasArtifact ? 'artefacto' : (aty > 0.45 ? 'atipico' : 'sano'));
  const qcStatus = bg ? 'Fondo' : (hasArtifact ? (state.qcOn ? 'Rechazado por QC' : 'Artefacto sin filtrar') : 'Aprobado');
  let ci = 0; for (let k = 1; k < 4; k++) if (clusterVotes[k] > clusterVotes[ci]) ci = k;
  return {
    col, row, cols, rows, u: (u0 + u1) / 2, v: (v0 + v1) / 2,
    cov, atypia: aty, lap, bg, flags, hasArtifact, tileType, qcStatus,
    rejected: hasArtifact && state.qcOn,
    clusterIndex: bg ? -1 : (aty > 0.45 ? 3 : ci),
    artifactKeys: ARTIFACT_KEYS.filter(k => flags[k])
  };
}

let compositeVersion = 0;

function drawIrregularNucleus(ctx, x, y, r, rng, fill, stroke, alpha) {
  const n = rng.int(6, 9), rot = rng.range(0, Math.PI * 2), sx = rng.range(0.75, 1.25), sy = rng.range(0.7, 1.1);
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const a = rot + (i % n) / n * Math.PI * 2, rr = r * rng.range(0.74, 1.22);
    const px = x + Math.cos(a) * rr * sx, py = y + Math.sin(a) * rr * sy;
    if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
  }
  ctx.closePath();
  ctx.globalAlpha = alpha; ctx.fillStyle = fill; ctx.fill(); ctx.globalAlpha = 1;
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}
function drawPoly(ctx, x, y, r, sides, rng, fill, stroke, alpha) {
  const rot = rng.range(0, 6.283);
  ctx.beginPath();
  for (let i = 0; i < sides; i++) {
    const a = rot + i / sides * 6.283, rr = r * rng.range(0.82, 1.15);
    const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
    if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
  }
  ctx.closePath();
  ctx.globalAlpha = alpha; ctx.fillStyle = fill; ctx.fill(); ctx.globalAlpha = 1;
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 0.9; ctx.stroke(); }
}
function dot(ctx, x, y, r, fill, alpha = 1) { ctx.globalAlpha = alpha; ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1; }
function ell(ctx, x, y, rx, ry, rot, fill, alpha = 1) { ctx.globalAlpha = alpha; ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1; }

const BASE_PAL = {
  he:  { bg: [250, 247, 250], tis: [238, 196, 214], cel: [212, 158, 196], aMax: 1 },
  pap: { bg: [243, 248, 250], tis: [221, 236, 241], cel: [205, 224, 235], aMax: 0.7 },
  ihc: { bg: [250, 250, 253], tis: [219, 228, 243], cel: [214, 184, 150], aMax: 1 }
};

/** Dibuja la textura microscópica 1024×512 de la modalidad indicada */
function generateBaseModalityCanvas(modality, target) {
  const m = MODALITIES[modality];
  const cv = target || makeCanvas(TEX_W, TEX_H), ctx = cv.getContext('2d');
  const rng = new SeededRandom(hashStr('base-' + modality));
  const P = BASE_PAL[modality];
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, TEX_W, TEX_H);
  ctx.fillStyle = `rgb(${P.bg[0]},${P.bg[1]},${P.bg[2]})`; ctx.fillRect(0, 0, TEX_W, TEX_H);

  // Capa 1: máscara suave de tejido a baja resolución, ampliada con suavizado
  const mw = 256, mh = 128, mc = makeCanvas(mw, mh), mctx = mc.getContext('2d');
  const img = mctx.createImageData(mw, mh);
  for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++) {
    const u = (x + 0.5) / mw, v = (y + 0.5) / mh, s = evaluateBiologicalSignals(u, v, modality);
    const a = smoothstep(0.08, 0.55, s.tissueCoverage) * P.aMax, t = s.atypiaScore, g = (hash2(x, y, 9) - 0.5) * 5;
    const o = (y * mw + x) * 4;
    for (let k = 0; k < 3; k++) {
      const tis = lerp(P.tis[k], P.cel[k], t);
      img.data[o + k] = clamp(lerp(P.bg[k], tis, a) + g, 0, 255);
    }
    img.data[o + 3] = 255;
  }
  mctx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(mc, 0, 0, TEX_W, TEX_H);

  const pick = (minCov, maxAt, tries) => {
    for (let k = 0; k < tries; k++) {
      const u = rng.next(), v = rng.next(), s = evaluateBiologicalSignals(u, v, modality);
      if (s.tissueCoverage >= minCov && s.atypiaScore <= maxAt) return { u, v, s };
    }
    return null;
  };
  ctx.lineCap = 'round';
  if (modality === 'he') paintHE(ctx, rng, m, pick);
  else if (modality === 'pap') paintPap(ctx, rng, m, pick);
  else paintIHC(ctx, rng, m, pick);
  return cv;
}

function paintHE(ctx, rng, m, pick) {
  const mod = 'he';
  // Fibras de estroma
  for (let i = 0; i < 900; i++) {
    const p = pick(0.55, 1, 6); if (!p) continue;
    const x = p.u * TEX_W, y = p.v * TEX_H, ang = fbm(p.u * 5, p.v * 5, m.maskSeed + 70, 2) * Math.PI * 3, len = rng.range(12, 34);
    ctx.strokeStyle = `rgba(${176 + rng.int(0, 30)},${96 + rng.int(0, 30)},${136 + rng.int(0, 30)},${0.16 + rng.next() * 0.16})`;
    ctx.lineWidth = rng.range(0.8, 1.8);
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + Math.cos(ang) * len * 0.5 + rng.range(-4, 4), y + Math.sin(ang) * len * 0.5 + rng.range(-4, 4), x + Math.cos(ang) * len, y + Math.sin(ang) * len);
    ctx.stroke();
  }
  // Glándulas benignas
  for (let g = 0; g < 110; g++) {
    const p = pick(0.72, 0.12, 25); if (!p) continue;
    const x = p.u * TEX_W, y = p.v * TEX_H, r = rng.range(9, 17);
    ell(ctx, x, y, r * 1.35, r * 1.15, rng.range(0, 3), 'rgb(222,150,185)', 0.55);
    ell(ctx, x, y, r * 0.62, r * 0.5, 0, 'rgb(253,248,251)', 0.96);
    const nn = rng.int(9, 13);
    for (let k = 0; k < nn; k++) {
      const a = k / nn * 6.283 + rng.range(-0.1, 0.1);
      ell(ctx, x + Math.cos(a) * r * 1.1, y + Math.sin(a) * r * 0.9, 2.7, 1.7, a + 1.57, '#4C3A7A', 0.62 + rng.next() * 0.3);
    }
  }
  // Núcleos benignos dispersos
  for (let i = 0; i < 5200; i++) {
    const p = pick(0.45, 0.4, 3); if (!p) continue;
    ell(ctx, p.u * TEX_W, p.v * TEX_H, rng.range(1.5, 2.9), rng.range(1.2, 2.2), rng.range(0, 3), '#4C3A7A', 0.42 + rng.next() * 0.34);
  }
  // Infiltrado inflamatorio
  for (let c = 0; c < 26; c++) {
    const p = pick(0.5, 0.35, 30); if (!p) continue;
    if (p.s.clusterKey !== 'infl' && rng.next() > 0.25) continue;
    const n = rng.int(8, 16), x = p.u * TEX_W, y = p.v * TEX_H;
    for (let k = 0; k < n; k++) dot(ctx, x + rng.range(-12, 12), y + rng.range(-10, 10), 2.1, '#342666', 0.86);
  }
  // Atipia: núcleos pleomórficos hipercromáticos con pérdida de arquitectura
  let placed = 0, tries = 0;
  while (placed < 1700 && tries < 9000) {
    tries++;
    const f = rng.next() < 0.68 ? m.primaryFocus : m.secondaryFocus;
    const u = f.u + rng.gauss() * f.rx * 0.62, v = f.v + rng.gauss() * f.ry * 0.62;
    if (u < 0 || u > 1 || v < 0 || v > 1) continue;
    const s = evaluateBiologicalSignals(u, v, mod);
    if (s.atypiaScore < 0.3 || rng.next() > s.atypiaScore) continue;
    const x = u * TEX_W, y = v * TEX_H, r = rng.range(3.6, 7.6) * (0.7 + 0.5 * s.atypiaScore);
    ell(ctx, x + rng.range(-2, 2), y + rng.range(-2, 2), r * 1.6, r * 1.35, rng.range(0, 3), 'rgb(201,91,130)', 0.34);
    drawIrregularNucleus(ctx, x, y, r, rng, rng.next() < 0.5 ? '#2D2056' : '#3A2A6E', '#1B1238', 0.92);
    if (rng.next() < 0.45) dot(ctx, x + rng.range(-1, 1), y + rng.range(-1, 1), 1.1, '#BE123C', 0.85);
    placed++;
  }
  // Figuras mitóticas
  for (let i = 0; i < 9; i++) {
    const f = m.primaryFocus, x = (f.u + rng.gauss() * f.rx * 0.45) * TEX_W, y = (f.v + rng.gauss() * f.ry * 0.45) * TEX_H;
    ctx.strokeStyle = '#150C30'; ctx.lineWidth = 2.2;
    for (let k = 0; k < 6; k++) { const a = rng.range(0, 6.283); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * 5.5, y + Math.sin(a) * 5.5); ctx.stroke(); }
    dot(ctx, x, y, 2.6, '#150C30', 0.95);
  }
}

function paintPap(ctx, rng, m, pick) {
  const mod = 'pap';
  // Moco fino
  for (let i = 0; i < 90; i++) {
    const x = rng.range(0, TEX_W), y = rng.range(0, TEX_H);
    ctx.strokeStyle = `rgba(${170 + rng.int(0, 30)},${205 + rng.int(0, 25)},${215 + rng.int(0, 25)},${0.14 + rng.next() * 0.14})`;
    ctx.lineWidth = rng.range(1, 4);
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.bezierCurveTo(x + rng.range(-40, 40), y + rng.range(-30, 30), x + rng.range(-60, 60), y + rng.range(-40, 40), x + rng.range(-80, 80), y + rng.range(-50, 50));
    ctx.stroke();
  }
  const sq = ['#A9D6D9', '#E8B8CB', '#BFDDE0', '#9FD0D6'];
  let n = 0, t = 0;
  while (n < 1350 && t < 12000) {
    t++;
    const u = rng.next(), v = rng.next(), s = evaluateBiologicalSignals(u, v, mod);
    if (s.atypiaScore > 0.35 || rng.next() > Math.pow(s.tissueCoverage, 1.3)) continue;
    const x = u * TEX_W, y = v * TEX_H;
    if (s.clusterIndex === 1) {            // endocervicales / metaplásicas
      drawPoly(ctx, x, y, rng.range(5, 8), 6, rng, '#8FCBC0', 'rgba(40,100,95,.5)', 0.68);
      dot(ctx, x + rng.range(-1, 1), y + rng.range(-1, 1), 2.3, '#3C2D6E', 0.86);
    } else if (s.clusterIndex === 2) {      // PMN
      dot(ctx, x, y, 5.5, '#C9DCEB', 0.35);
      for (let k = 0; k < 3; k++) dot(ctx, x + rng.range(-2.6, 2.6), y + rng.range(-2.6, 2.6), 1.7, '#372D69', 0.92);
    } else {                                // escamosas normales
      drawPoly(ctx, x, y, rng.range(9, 15), 6, rng, sq[rng.int(0, 3)], 'rgba(60,100,115,.45)', 0.55);
      dot(ctx, x + rng.range(-1.5, 1.5), y + rng.range(-1.5, 1.5), 1.9, '#4C3A7A', 0.9);
    }
    n++;
  }
  // Grupos cohesivos HSIL (alta relación núcleo/citoplasma)
  [[m.primaryFocus, 10], [m.secondaryFocus, 6]].forEach(([f, groups]) => {
    for (let g = 0; g < groups; g++) {
      const gx = (f.u + rng.gauss() * f.rx * 0.5) * TEX_W, gy = (f.v + rng.gauss() * f.ry * 0.5) * TEX_H, cells = rng.int(8, 15);
      for (let k = 0; k < cells; k++) {
        const a = rng.range(0, 6.283), d = Math.abs(rng.gauss()) * 9;
        const cx = gx + Math.cos(a) * d, cy = gy + Math.sin(a) * d * 0.9;
        drawPoly(ctx, cx, cy, rng.range(5.5, 8), 7, rng, '#86B2C4', 'rgba(40,70,100,.6)', 0.72);
        drawIrregularNucleus(ctx, cx, cy, rng.range(3.4, 5.2), rng, '#2A1850', '#150B30', 0.94);
      }
    }
  });
}

function paintIHC(ctx, rng, m, pick) {
  const mod = 'ihc';
  // Núcleos contrateñidos con hematoxilina
  for (let i = 0; i < 5200; i++) {
    const p = pick(0.45, 1, 3); if (!p) continue;
    ell(ctx, p.u * TEX_W, p.v * TEX_H, rng.range(1.6, 3.1), rng.range(1.3, 2.4), rng.range(0, 3), '#4F6DB0', 0.42 + rng.next() * 0.32);
  }
  // Marcaje DAB membranoso/nuclear
  let n = 0, t = 0;
  while (n < 2300 && t < 14000) {
    t++;
    const f = rng.next() < 0.7 ? m.primaryFocus : m.secondaryFocus;
    const u = f.u + rng.gauss() * f.rx * 0.8, v = f.v + rng.gauss() * f.ry * 0.8;
    if (u < 0 || u > 1 || v < 0 || v > 1) continue;
    const s = evaluateBiologicalSignals(u, v, mod);
    if (s.atypiaScore < 0.14 || rng.next() > s.atypiaScore * 1.1) continue;
    const x = u * TEX_W, y = v * TEX_H, r = rng.range(4.5, 8), strong = s.atypiaScore > 0.45;
    ctx.globalAlpha = strong ? 0.9 : 0.6;
    ctx.strokeStyle = strong ? '#78350F' : '#B45309'; ctx.lineWidth = strong ? 2.2 : 1.5;
    ctx.beginPath(); ctx.ellipse(x, y, r * rng.range(0.9, 1.15), r * rng.range(0.8, 1.05), rng.range(0, 3), 0, 6.283); ctx.stroke();
    ctx.globalAlpha = 1;
    ell(ctx, x, y, r * 0.95, r * 0.85, 0, '#92400E', strong ? 0.34 : 0.18);
    if (strong || rng.next() < 0.4) dot(ctx, x + rng.range(-1, 1), y + rng.range(-1, 1), r * 0.42, '#92400E', strong ? 0.82 : 0.55);
    n++;
  }
}

/** Vista de alto aumento (40×) procedural; atypia ∈ [0,1] controla la patología */
function drawHighMag40xView(ctx, w, h, modality, atypia, seed) {
  const rng = new SeededRandom(hashStr('hm-' + modality) + seed * 977), s = w / 160;
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.clearRect(0, 0, w, h);
  if (modality === 'he') {
    ctx.fillStyle = '#F2D2E0'; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) ell(ctx, rng.range(0, w), rng.range(0, h), rng.range(2, 9) * s, rng.range(1, 4) * s, rng.range(0, 3.14), `rgb(${200 + rng.int(0, 35)},${120 + rng.int(0, 40)},${160 + rng.int(0, 30)})`, 0.1 + rng.next() * 0.14);
    const n = Math.round(lerp(34, 20, atypia));
    for (let i = 0; i < n; i++) {
      const x = rng.range(0.06, 0.94) * w, y = rng.range(0.06, 0.94) * h, r = lerp(4.3, 7.8, atypia) * s * rng.range(0.7, 1.25);
      ell(ctx, x, y, r * 1.7, r * 1.45, rng.range(0, 3), 'rgb(224,140,176)', 0.45);
      if (atypia > 0.4) {
        drawIrregularNucleus(ctx, x, y, r, rng, '#2B1D52', '#150C30', 0.95);
        dot(ctx, x - r * 0.2, y - r * 0.15, r * 0.28, '#7864AA', 0.5);
        if (rng.next() < 0.7) dot(ctx, x + r * 0.15, y + r * 0.1, r * 0.17, '#BE123C', 0.9);
      } else {
        ell(ctx, x, y, r * 0.9, r * 0.78, rng.range(0, 3), '#58428C', 0.85);
        dot(ctx, x - r * 0.2, y - r * 0.2, r * 0.3, '#7864AA', 0.35);
      }
    }
    if (atypia > 0.55) for (let i = 0; i < 2; i++) {
      const x = rng.range(0.2, 0.8) * w, y = rng.range(0.2, 0.8) * h;
      ctx.strokeStyle = '#150C30'; ctx.lineWidth = 1.6 * s;
      for (let k = 0; k < 7; k++) { const a = rng.range(0, 6.283); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * 6 * s, y + Math.sin(a) * 6 * s); ctx.stroke(); }
      dot(ctx, x, y, 3 * s, '#150C30', 0.95);
    }
  } else if (modality === 'pap') {
    ctx.fillStyle = '#EEF5F7'; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 160; i++) dot(ctx, rng.range(0, w), rng.range(0, h), rng.range(0.6, 2) * s, '#B9D3DC', 0.25);
    if (atypia > 0.4) {
      const n = 13;
      for (let i = 0; i < n; i++) {
        const a = rng.range(0, 6.283), d = Math.abs(rng.gauss()) * 28 * s, x = w / 2 + Math.cos(a) * d, y = h / 2 + Math.sin(a) * d * 0.9, r = rng.range(11, 15) * s;
        drawPoly(ctx, x, y, r, 7, rng, '#86B2C4', 'rgba(40,70,100,.65)', 0.72);
        drawIrregularNucleus(ctx, x, y, r * rng.range(0.5, 0.65), rng, '#2A1850', '#150B30', 0.95);
        if (rng.next() < 0.5) dot(ctx, x, y, r * 0.1, '#6B5BA8', 0.8);
      }
    } else {
      for (let i = 0; i < 6; i++) {
        const x = rng.range(0.15, 0.85) * w, y = rng.range(0.15, 0.85) * h, r = rng.range(20, 26) * s;
        drawPoly(ctx, x, y, r, 6, rng, ['#A9D6D9', '#E8B8CB', '#BFDDE0'][rng.int(0, 2)], 'rgba(60,100,115,.5)', 0.6);
        dot(ctx, x, y, 3.3 * s, '#4C3A7A', 0.92);
      }
    }
  } else {
    ctx.fillStyle = '#E4EAF6'; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 200; i++) ell(ctx, rng.range(0, w), rng.range(0, h), rng.range(2, 8) * s, rng.range(1, 3) * s, rng.range(0, 3), '#B7C5E6', 0.2);
    const n = 24;
    for (let i = 0; i < n; i++) {
      const x = rng.range(0.07, 0.93) * w, y = rng.range(0.07, 0.93) * h, r = rng.range(6.5, 9) * s;
      const pos = rng.next() < atypia;
      if (pos) {
        ctx.globalAlpha = 0.92; ctx.strokeStyle = '#78350F'; ctx.lineWidth = 2.6 * s;
        ctx.beginPath(); ctx.ellipse(x, y, r * 1.45, r * 1.25, rng.range(0, 3), 0, 6.283); ctx.stroke(); ctx.globalAlpha = 1;
        ell(ctx, x, y, r * 1.35, r * 1.15, 0, '#92400E', 0.3);
        ell(ctx, x, y, r * 0.8, r * 0.7, rng.range(0, 3), '#92400E', 0.85);
      } else {
        ell(ctx, x, y, r * 0.85, r * 0.72, rng.range(0, 3), '#4F6DB0', 0.8);
        dot(ctx, x - r * 0.2, y - r * 0.2, r * 0.25, '#7F98CF', 0.5);
      }
    }
  }
  ctx.restore();
}

/* ---------- Artefactos sobre la textura compuesta ---------- */
function drawBlurArtifact(ctx) {
  const A = ARTIFACTS.blur, cx = A.cu * TEX_W, cy = A.cv * TEX_H, rx = A.rx * TEX_W * 1.15, ry = A.ry * TEX_H * 1.15;
  const x0 = Math.max(0, Math.floor(cx - rx)), y0 = Math.max(0, Math.floor(cy - ry));
  const w = Math.min(TEX_W - x0, Math.ceil(rx * 2)), h = Math.min(TEX_H - y0, Math.ceil(ry * 2));
  const small = makeCanvas(Math.max(4, Math.floor(w / 12)), Math.max(4, Math.floor(h / 12)));
  const sctx = small.getContext('2d'); sctx.imageSmoothingQuality = 'high';
  sctx.drawImage(baseCanvas, x0, y0, w, h, 0, 0, small.width, small.height);
  const tmp = makeCanvas(w, h), t = tmp.getContext('2d');
  t.imageSmoothingEnabled = true; t.imageSmoothingQuality = 'high';
  t.drawImage(small, 0, 0, small.width, small.height, 0, 0, w, h);
  t.globalCompositeOperation = 'destination-in';
  t.save(); t.translate(cx - x0, cy - y0); t.scale(1, ry / rx);
  const g = t.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.62, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  t.fillStyle = g; t.fillRect(-rx * 1.2, -rx * 1.2, rx * 2.4, rx * 2.4); t.restore();
  ctx.drawImage(tmp, x0, y0);
}
function drawFoldsArtifact(ctx) {
  const A = ARTIFACTS.folds, ax = A.a[0] * TEX_W, ay = A.a[1] * TEX_H, bx = A.b[0] * TEX_W, by = A.b[1] * TEX_H, wpx = A.w * TEX_H;
  const col = state.modality === 'ihc' ? 'rgba(45,40,80,' : 'rgba(70,25,85,';
  ctx.save(); ctx.lineCap = 'round';
  ctx.strokeStyle = col + '0.34)'; ctx.lineWidth = wpx * 1.8; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
  ctx.strokeStyle = col + '0.55)'; ctx.lineWidth = wpx * 0.95; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
  const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy), nx = -dy / len, ny = dx / len, rng = new SeededRandom(777);
  for (let i = 0; i < 14; i++) {
    const off = (i / 13 - 0.5) * wpx * 1.5;
    ctx.strokeStyle = `rgba(35,10,55,${0.22 + 0.25 * rng.next()})`; ctx.lineWidth = 1 + rng.next() * 1.8;
    ctx.beginPath();
    for (let s = 0; s <= 24; s++) {
      const t = s / 24, wob = Math.sin(t * 9 + i) * 2.5, x = ax + dx * t + nx * (off + wob), y = ay + dy * t + ny * (off + wob);
      if (s) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    }
    ctx.stroke();
  }
  if (state.modality === 'pap') for (let i = 0; i < 90; i++) { const t = rng.next(); dot(ctx, ax + dx * t + nx * rng.range(-wpx, wpx), ay + dy * t + ny * rng.range(-wpx, wpx), rng.range(2, 4.5), '#2A1850', 0.7); }
  ctx.restore();

/** Genera las muestras de parches (una nube por modalidad) y los vectores de ruido deterministas */
function rebuildUmapData() {

  const quotas = [0.30, 0.28, 0.20, 0.22], samples = [];
  for (let c = 0; c < 4; c++) {
    const n = Math.round(UMAP_N * quotas[c]); let k = 0, tries = 0;
    while (k < n && tries < 30000) {
      tries++;

      if (c === 3) { const f = rng.next() < 0.7 ? M.primaryFocus : M.secondaryFocus; u = f.u + rng.gauss() * f.rx * 0.8; v = f.v + rng.gauss() * f.ry * 0.8; }

      if (u < 0 || u > 1 || v < 0 || v > 1) continue;
      if (evaluateBiologicalSignals(u, v, mod).clusterIndex !== c) continue;
      samples.push({ u, v, cluster: c, hosp: rng.int(0, 2) }); k++;
    }
  }
  while (samples.length < UMAP_N) { const b = samples[samples.length % Math.max(1, samples.length)] || { u: 0.5, v: 0.5, cluster: 0, hosp: 0 }; samples.push({ u: clamp(b.u + rng.range(-0.02, 0.02)), v: clamp(b.v + rng.range(-0.02, 0.02)), cluster: b.cluster, hosp: rng.int(0, 2) }); }
  samples.length = UMAP_N;
  // Muestras contaminantes (una por artefacto y parche, en la región del artefacto)
  const contam = [];
  ARTIFACT_KEYS.forEach(key => {
    for (let j = 0; j < UMAP_CONTAM_PER; j++) {
      let u = 0.5, v = 0.5;
      for (let t = 0; t < 4000; t++) { u = rng.next(); v = rng.next(); if (evaluateArtifactAt(u, v, { [key]: true })[key] > 0.7) break; }
      contam.push({ u, v, key, hosp: rng.int(0, 2) });
    }
  });

  const prev = s3.umap;
  s3.umap = {
    samples, contam, R: jit(), Jm: jit(), Jh: jit(), Jc: jit(),
    tgtU: new Float32Array(nR), tgtT: new Float32Array(nR), cur: prev ? prev.cur : new Float32Array(nR), scl: prev ? prev.scl : new Float32Array(UMAP_MAX),
    encT: prev ? prev.encT : 0, hospThumbKey: ''

  if (!prev) for (let i = 0; i < nR; i++) s3.umap.cur[i] = (s3.umap.R[i]) * 0.5;

}

}
function contamCount() { let n = 0; for (let i = UMAP_N; i < UMAP_MAX; i++) if (contamActive(i)) n++; return n; }

function updateUmapTargets() {
  const s3 = world.s3, U = s3.umap, M = MODALITIES[state.modality], nm = NORM_MODES[state.normMode];
  const b = nm.batch, sp = 0.30 + Math.pow(1 - nm.purity, 1.2) * 1.7, bun = UNTRAINED_METRICS.batch;
  const dirs = [[1, 0.2, 0], [-1, 0.1, 0.3], [0.2, 1, -0.3], [0, -0.6, 1]];
  for (let i = 0; i < UMAP_MAX; i++) {
    const o = i * 3;
    if (i < UMAP_N) {
      const smp = U.samples[i], c = M.clusters[smp.cluster].center, hc = HOSPITALS[smp.hosp].center;
      for (let k = 0; k < 3; k++) {
        const mp = c[k] + U.Jm[o + k] * sp, hp = hc[k] + U.Jh[o + k] * 0.55;
        U.tgtT[o + k] = lerp(mp, hp, b);
        U.tgtU[o + k] = U.R[o + k] * 1.5 + hc[k] * 0.4 * bun;
      }
    } else {
      const a = Math.floor((i - UMAP_N) / UMAP_CONTAM_PER), d = dirs[a];
      for (let k = 0; k < 3; k++) {
        U.tgtT[o + k] = 0.2 + d[k] * 0.9 + U.Jc[o + k] * 1.05;
        U.tgtU[o + k] = U.R[o + k] * 1.5;
      }
    }
    U.tgtT[o + 1] *= UMAP_Y_SCALE; U.tgtU[o + 1] *= UMAP_Y_SCALE;

}
function pointColorHex(i) {

}
function applyUmapColors() {

  for (let i = 0; i < UMAP_MAX; i++) { col.setHex(pointColorHex(i)); s3.mesh.setColorAt(i, col); }
  s3.mesh.instanceColor.needsUpdate = true;

/** Efecto lote y pureza morfológica que se muestran en el panel (interpoladas con el estado del encoder) */
function umapMetrics() {

  for (let i = 0; i <= 5; i++) {

function syncControls() {
  $$('[data-set]').forEach(b => {
    const cur = String(getPath(state, b.dataset.set)), on = cur === b.dataset.value;
    b.classList.toggle('active', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  $$('[data-toggle]').forEach(i => { i.checked = !!getPath(state, i.dataset.toggle); });
  $$('[data-slider]').forEach(i => {
    const key = i.dataset.slider, sc = parseFloat(i.dataset.scale || 1), v = getPath(state, key);
    if (document.activeElement !== i) i.value = Math.round(v / sc * 1000) / 1000;
    const lab = document.querySelector(`[data-valfor="${key}"]`); if (lab) lab.textContent = (FMT[key] || (x => x))(v);
  });
  $$('.stage-btn').forEach(b => { const on = +b.dataset.stage === state.stage; b.classList.toggle('active', on); if (on) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current'); });
}

      ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fillRect(12, cv.height - 30, bp + 62, 20);

      ctx.fillStyle = 'rgba(76,58,122,0.92)'; ctx.fillRect(cv.width - 54, 10, 44, 22); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(L.mag + '×', cv.width - 32, 25);
      setText('pyr-cap-l', `Objetivo ${L.mag}× · ROI en el foco atípico`); setText('pyr-cap-r', `${L.res} µm/px`);
    }

    const pxs = (M.scanMm[0] * 1000 / L.res) * (M.scanMm[1] * 1000 / L.res), gb = pxs * 3 / 1e9;
    setText('s1-res', L.res.toFixed(2) + ' µm/px'); setText('s1-size', fmtBytes(gb)); setText('s1-px', pxs >= 1e9 ? (pxs / 1e9).toFixed(2) + ' Gpx' : (pxs / 1e6).toFixed(0) + ' Mpx');

    const note = $('#s1-note'); if (note) note.innerHTML = `Área escaneada: ${M.scanMm[0]} × ${M.scanMm[1]} mm. ${state.pyramidLevel <= 1 ? 'Nivel con buen contexto, poco detalle: sirve para localizar regiones.' : 'Nivel con detalle nuclear, poco contexto: sirve para graduar la atipia.'}`;
  } else if (n === 2) {

function findUmapIndex(info) {
  if (info.bg || info.rejected) return -1;
  const U = world.s3.umap; if (!U) return -1;
  let best = -1, bd = 1e9;
  if (info.hasArtifact) {
    U.contam.forEach((c, j) => { if (!info.artifactKeys.includes(c.key)) return; const d = (c.u - info.u) ** 2 * 4 + (c.v - info.v) ** 2; if (d < bd) { bd = d; best = UMAP_N + j; } });
    return best;
  }
  U.samples.forEach((s, i) => { const d = (s.u - info.u) ** 2 * 4 + (s.v - info.v) ** 2 + (s.cluster === info.clusterIndex ? 0 : 1); if (d < bd) { bd = d; best = i; } });
  return best;
}
function makeThumb(info) {
  const c = makeCanvas(96, 96), x = c.getContext('2d'), du = 1 / info.cols, dv = 1 / info.rows;
  drawCompositeCrop(x, info.u - du / 2, info.v - dv / 2, info.u + du / 2, info.v + dv / 2, 96, 96);
  return c.toDataURL('image/png');
}
function fillPinned(p, info) {
  p.col = info.col; p.row = info.row; p.u = info.u; p.v = info.v;
  p.tileType = info.tileType; p.qcStatus = info.qcStatus; p.laplacian = info.lap; p.atypia = info.atypia;
  p.bagIndex = cellIndexUV(info.u, info.v); p.umapIndex = findUmapIndex(info); p.thumbnailDataUrl = makeThumb(info);
}
function pinPatchAtTile(col, row, silent) {

  state.pinned = { anchorU: info.u, anchorV: info.v };

  if (!silent) toast(`Parche (${col}, ${row}) fijado: ${TILE_TYPE_LABEL[info.tileType]} · ${info.qcStatus}`);
}
function pinPatchAtUV(u, v) {

}
function refreshPinned() {
  const p = state.pinned, s2 = world.s2; if (!p || !s2.infos.length) return;
  const col = Math.min(s2.cols - 1, Math.floor(p.anchorU * s2.cols)), row = Math.min(s2.rows - 1, Math.floor(p.anchorV * s2.rows));
  fillPinned(p, s2.infos[row * s2.cols + col]); hudSig = ''; dirty.sidebarLive = true;
}
function unpin() { state.pinned = null; hudSig = ''; dirty.sidebarLive = true; }
function pinQuick(kind) {
  const s2 = world.s2; if (!s2.infos.length) return;
  let list = s2.infos.filter(i => !i.bg);
  if (kind === 'artifact') {
    let cand = s2.infos.filter(i => i.hasArtifact);
    if (!cand.length) { state.artifacts.folds = true; markArtifactsChanged(); processDirty(true); cand = s2.infos.filter(i => i.hasArtifact); toast('Se activó «Pliegues / Acúmulos» para tener un artefacto que seguir.'); }
    cand.sort((a, b) => b.artifactKeys.length - a.artifactKeys.length || b.atypia - a.atypia);
    if (cand.length) pinPatchAtTile(cand[0].col, cand[0].row, true), toast(`Artefacto fijado en (${cand[0].col}, ${cand[0].row}): ${cand[0].qcStatus}`);
    return;
  }
  list = list.filter(i => !i.hasArtifact);
  if (kind === 'atypical') list.sort((a, b) => b.atypia - a.atypia);
  else list.sort((a, b) => (b.cov * (1 - b.atypia) * (b.atypia < 0.12 ? 1 : 0.2)) - (a.cov * (1 - a.atypia) * (a.atypia < 0.12 ? 1 : 0.2)));

}

function setState(path, value) {
  const old = getPath(state, path); if (old === value) return;
  setPathVal(state, path, value);
  onStateChange(path);
  syncControls();
}
function onStateChange(path) {
  if (path === 'modality') return changeModality();
  if (path === 'pyramidLevel' || path === 'showPyramid' || path === 'showGigaGrid') { applyStage1State(); dirty.sidebarLive = true; }
  else if (path === 'patchSize') { rebuildTiles(); dirty.sidebarLive = true; }
  else if (path === 'discardBg' || path === 'explode') { dirty.tilesVisual = true; }
  else if (path.startsWith('artifacts.') || path === 'qcOn') { markArtifactsChanged(); dirty.legend = true; }
  else if (path === 'encoderTrained' || path === 'normMode' || path === 'umapColor') { dirty.umap = true; dirty.sidebarLive = true; dirty.legend = true; }
  else if (['aggregator', 'groundTruth', 'dilution', 'distractor'].includes(path)) { dirty.mil = true; dirty.sidebarLive = true; }
  else if (path === 'heatOpacity') applyHeatVisibility();
  else if (path === 'heatThreshold' || path === 'heatScale') { dirty.heatColor = true; dirty.sidebarLive = true; dirty.legend = true; }
  else if (path === 'tau') dirty.sidebarLive = true;
}

  hudSig = '';

}

function disposeAll() {
  Object.values(stageGroups).forEach(g => disposeObjectTree(g));
  if (renderer) { renderer.dispose(); }
}

/* =====================================================================
   19. INTERACCIÓN 3D: RAYCASTING, TOOLTIP Y CLIC
   ===================================================================== */
const pointerPx = { x: 0, y: 0 };
let pointerIn = false, hoverDirty = false, dragging = false;
function showTooltip(html) {
  const tt = $('#tooltip'), host = $('#viewport');
  tt.innerHTML = html; tt.style.display = 'block';
  const w = tt.offsetWidth, h = tt.offsetHeight;
  let x = pointerPx.x + 16, y = pointerPx.y + 14;
  if (x + w > host.clientWidth - 6) x = pointerPx.x - w - 14;
  if (y + h > host.clientHeight - 6) y = pointerPx.y - h - 12;
  tt.style.left = Math.max(4, x) + 'px'; tt.style.top = Math.max(4, y) + 'px';
}
function hideTooltip() { const t = $('#tooltip'); if (t) t.style.display = 'none'; if (renderer) renderer.domElement.style.cursor = 'grab'; }
const ttRow = (k, v) => `<div class="tt-r"><span>${k}</span><b>${v}</b></div>`;
function runHover() {
  hoverDirty = false;
  if (!pointerIn || dragging || camTween.active) return;
  raycaster.setFromCamera(pointer, camera);
  const n = state.stage, cv = renderer.domElement;
  let tip = null, cursor = 'grab';
  if (n === 1 && world.s1.pyr.visible) {
    const h = raycaster.intersectObjects(world.s1.planes, false)[0];
    if (h) { const L = PYR_LEVELS[h.object.userData.level]; tip = `<div class="tt-t">Plano ${L.mag}×</div>${ttRow('resolución', L.res + ' µm/px')}${ttRow('contexto', L.context + '%')}${ttRow('detalle', L.detail + '%')}<div style="color:#94A3B8;margin-top:3px">clic para activar</div>`; cursor = 'pointer'; }
  } else if (n === 2) {
    const h = raycaster.intersectObjects(world.s2.tiles, false)[0];
    world.s2.hoverIndex = h ? h.object.userData.tileIndex : -1;
    if (h) {
      const i = world.s2.infos[h.object.userData.tileIndex];
      if (i) { tip = `<div class="tt-t">Tesela (${i.col}, ${i.row}) · ${TILE_TYPE_LABEL[i.tileType]}</div>${ttRow('cobertura', (i.cov * 100).toFixed(0) + '%')}${ttRow('Var. Laplaciana', i.lap.toFixed(1))}${ttRow('atipia', i.atypia.toFixed(2))}${ttRow('estado QC', i.qcStatus)}${i.artifactKeys.length ? ttRow('artefacto', i.artifactKeys.map(k => ARTIFACTS[k].label.split(' ')[0]).join(', ')) : ''}<div style="color:#94A3B8;margin-top:3px">clic para fijar el parche</div>`; cursor = 'pointer'; }
    }
  } else if (n === 3) {
    const h = raycaster.intersectObject(world.s3.mesh, false)[0];
    if (h && h.instanceId !== undefined && contamActive(h.instanceId)) {
      const i = h.instanceId, U = world.s3.umap;
      if (i >= UMAP_N) tip = `<div class="tt-t">Contaminante #${i}</div>${ttRow('origen', ARTIFACTS[U.contam[i - UMAP_N].key].label)}<div style="color:#FCA5A5">Módulo de QC apagado</div>`;
      else { const s = U.samples[i]; tip = `<div class="tt-t">Parche UMAP #${i}</div>${ttRow('morfología', MODALITIES[state.modality].clusters[s.cluster].label)}${ttRow('hospital', HOSPITALS[s.hosp].name)}${ttRow('u, v', s.u.toFixed(2) + ', ' + s.v.toFixed(2))}<div style="color:#94A3B8;margin-top:3px">clic para fijar este parche</div>`; cursor = 'pointer'; }
    }
  } else if (n === 4) {
    const h = raycaster.intersectObject(world.s4.nodes, false)[0], S = world.s4.state;
    if (h && h.instanceId !== undefined && S) {
      const k = h.instanceId, W = activeWeights();
      tip = `<div class="tt-t">Instancia #${k} (${k % MIL_COLS}, ${Math.floor(k / MIL_COLS)})</div>${ttRow('s_k', S.s[k].toFixed(3))}${ttRow('a_k', (W[k] * 100).toFixed(2) + '%')}${ttRow('rol', S.excl[k] ? 'excluida por QC' : S.isDist[k] ? 'distractor' : S.isPos[k] ? 'positiva' : 'sana')}<div style="color:#94A3B8;margin-top:3px">clic para fijar este parche</div>`; cursor = 'pointer';
    }
  } else if (n === 5) {
    const vis = heatVisible();
    if (vis) { const mh = raycaster.intersectObjects(world.s5.markers.map(m => m.hit), false)[0]; if (mh) { const t = MODALITIES[state.modality].top3[mh.object.userData.top3]; tip = `<div class="tt-t">Top-${t.rank} · parche ${t.coords}</div>${ttRow('a_k', (world.s4.state.w.att[t.bagIndex] * 100).toFixed(1) + '%')}`; cursor = 'pointer'; } }
    if (!tip) {
      const h = raycaster.intersectObject(world.s5.slide.tissue, false)[0];
      if (h) {
        const u = h.uv.x, v = 1 - h.uv.y;
        if (state.challenge.active && !state.challenge.revealed) { tip = `<div class="tt-t">Reto activo</div>${ttRow('u, v', u.toFixed(2) + ', ' + v.toFixed(2))}<div style="color:#FDE68A">clic para marcar sospecha (${state.challenge.pins.length}/3)</div>`; cursor = 'crosshair'; }
        else if (vis) tip = `<div class="tt-t">Lámina XAI</div>${ttRow('u, v', u.toFixed(2) + ', ' + v.toFixed(2))}${ttRow('calor', heatAt(u, v).toFixed(2))}`;
      }
    }
  }
  if (tip) showTooltip(tip); else { $('#tooltip').style.display = 'none'; }
  cv.style.cursor = cursor;
}
function handleViewportClick() {
  if (camTween.active) return;
  raycaster.setFromCamera(pointer, camera);
  const n = state.stage;
  if (n === 1 && world.s1.pyr.visible) {
    const h = raycaster.intersectObjects(world.s1.planes, false)[0];
    if (h) setState('pyramidLevel', h.object.userData.level);
  } else if (n === 2) {
    const h = raycaster.intersectObjects(world.s2.tiles, false)[0];
    if (h) pinPatchAtTile(h.object.userData.col, h.object.userData.row);
  } else if (n === 3) {
    const h = raycaster.intersectObject(world.s3.mesh, false)[0];
    if (h && h.instanceId !== undefined && h.instanceId < UMAP_N && contamActive(h.instanceId)) { const s = world.s3.umap.samples[h.instanceId]; pinPatchAtUV(s.u, s.v); }
  } else if (n === 4) {
    const h = raycaster.intersectObject(world.s4.nodes, false)[0];
    if (h && h.instanceId !== undefined) { const k = h.instanceId; pinPatchAtUV(((k % MIL_COLS) + 0.5) / MIL_COLS, (Math.floor(k / MIL_COLS) + 0.5) / MIL_ROWS); }
  } else if (n === 5) {
    if (heatVisible()) { const mh = raycaster.intersectObjects(world.s5.markers.map(m => m.hit), false)[0]; if (mh) { selectTop3(mh.object.userData.top3); return; } }
    const ch = state.challenge;
    if (ch.active && !ch.revealed) {
      const h = raycaster.intersectObject(world.s5.slide.tissue, false)[0];
      if (h) { if (addChallengePin(h.uv.x, 1 - h.uv.y)) renderSidebar(true); else toast('Máximo 3 pines. Pulsa «Revelar IA y Evaluar».'); }
    }
  }
}

/* =====================================================================
   20. QUIZ CONCEPTUAL (8 PREGUNTAS)
   ===================================================================== */
const QUIZ = [
  { q: '¿Por qué un archivo WSI guarda varios niveles de aumento (5×, 10×, 20×, 40×) en lugar de una sola imagen?',

    e: 'La pirámide permite elegir el aumento según la pregunta: a bajo aumento se localiza y se ve la arquitectura; a alto aumento se evalúa la atipia nuclear. Cargar los gigapíxeles del nivel base completo no es viable.' },

    e: 'La dilución extrema de la citología cervical convencional hace que unas pocas células de alto grado queden rodeadas de miles de normales. Esto condiciona la elección del agregador en MIL.' },
  { q: '¿Por qué la varianza del Laplaciano sirve como criterio de control de calidad frente a desenfoque, tinta y pliegues?',
    o: ['Un parche desenfocado pierde bordes y su varianza Laplaciana cae bajo el umbral; la tinta y los pliegues se detectan con reglas de color y textura complementarias.', 'Porque mide el color promedio del parche y detecta la tinta verde.', 'Porque cuenta el número de núcleos por campo.', 'Porque indica cuánto fondo blanco hay en el parche.'], c: 0,
    e: 'El Laplaciano responde a cambios bruscos de intensidad. Una imagen fuera de foco es suave, con pocos bordes y varianza baja. Un parche de fondo también tiene varianza baja, por eso se distingue por cobertura de tejido.' },
  { q: '¿Qué representa el espacio latente UMAP de un Foundation Encoder (ViT)?',
    o: ['La posición física de cada parche sobre el portaobjetos.', 'La probabilidad de diagnóstico de cada parche.', 'Las coordenadas de píxel asignadas por el escáner.', 'Una proyección 3D de los vectores z de cada parche, donde la cercanía indica similitud aprendida por el encoder (idealmente morfológica).'], c: 3,
    e: 'UMAP reduce los vectores de alta dimensión a 3D conservando la vecindad. Con preentrenamiento, los parches con morfología parecida quedan juntos; con pesos aleatorios, no hay estructura.' },
  { q: 'En el simulador, los puntos del UMAP se agrupan por hospital y no por morfología. ¿Qué indica y cómo se corrige?',
    o: ['Indica que hay pocos parches; se corrige entrenando más épocas.', 'Es el efecto lote (domain shift): el encoder codifica tinción y escáner. Se reduce con normalización de Macenko o con un encoder SSL invariante al escáner.', 'Indica que el modelo ya distingue bien los diagnósticos; no requiere corrección.', 'Se corrige aumentando el umbral τ.'], c: 1,
    e: 'Si el espacio latente separa centros, el clasificador aprenderá atajos de color. Macenko alinea la tinción; los modelos SSL aprenden representaciones que dependen menos del escáner.' },
  { q: '¿Por qué Mean Pooling falla en MIL cuando la lesión ocupa menos del 2 % de la lámina?',
    o: ['Porque requiere etiquetas por parche.', 'Porque solo mira el parche más grande.', 'Porque promedia las puntuaciones: los pocos parches positivos se diluyen entre cientos de sanos y Ŷ queda bajo 0.50 (falso negativo).', 'Porque ignora los parches sanos.'], c: 2,
    e: 'Con a_k = 1/N, la contribución de K parches positivos es proporcional a K/N. Con K = 3 de 200, Ŷ queda cerca de la puntuación de los sanos.' },
  { q: '¿Qué ventaja tiene Gated Attention MIL (CLAM) frente a Max Pooling cuando hay un artefacto distractor?',
    o: ['Aprende pesos de atención que privilegian rasgos morfológicos reales y atenúan al distractor; Max Pooling toma el máximo sin discriminar y predice falso positivo.', 'Siempre da una probabilidad más alta que Max Pooling.', 'No necesita el softmax porque los pesos ya suman 1.', 'Elimina el distractor antes de calcular la atención, sin usar pesos.'], c: 0,
    e: 'La compuerta tanh ⊙ σ modula qué rasgos cuentan. El distractor tiene puntuación alta pero rasgos de artefacto, así que recibe peso casi nulo tras el softmax; Max Pooling solo ve el valor 0.92.' },
  { q: 'En un escenario de tamización poblacional, ¿cómo conviene fijar el umbral clínico τ en comparación con una confirmación diagnóstica?',
    o: ['Alto, para evitar cualquier falso positivo.', 'Siempre 0.50, porque es el punto equilibrado.', 'Da igual: la curva ROC es la misma para cualquier τ.', 'Bajo: prioriza la sensibilidad y minimiza falsos negativos, aceptando más falsos positivos que se resuelven con una prueba posterior. La confirmación usa un τ más alto.'], c: 3,
    e: 'En tamización, perder una lesión es más costoso que repetir o confirmar un caso. Un τ bajo sube la sensibilidad y el VPN, y baja el VPP. En confirmación se busca precisión.' }
];
let quiz = { i: 0, score: 0, answered: false, sel: -1, done: false }, quizLastFocus = null;
function openQuiz(reset) {
  if (reset) quiz = { i: 0, score: 0, answered: false, sel: -1, done: false };
  quizLastFocus = document.activeElement; $('#quiz-modal').classList.add('show'); renderQuiz();
}
function closeQuiz() { $('#quiz-modal').classList.remove('show'); if (quizLastFocus && quizLastFocus.focus) quizLastFocus.focus(); }
function renderQuiz() {
  const m = $('#quiz-modal'), Q = QUIZ[quiz.i], L = 'ABCD';
  let h;
  if (quiz.done) {
    const pct = Math.round(quiz.score / QUIZ.length * 100);
    h = `<div class="quiz-card"><div class="quiz-top"><span class="kicker" id="quiz-title">Quiz conceptual · resultado</span></div>
      <div class="quiz-prog"><div style="width:100%"></div></div>
      <div style="text-align:center;padding:14px 0 6px"><div class="score-big" style="font-size:44px;color:${pct >= 75 ? 'var(--teal)' : pct >= 50 ? 'var(--amber)' : 'var(--crimson)'}">${quiz.score} / ${QUIZ.length}</div>
      <p style="color:var(--ink2);margin:6px 0 0">${pct >= 87 ? 'Dominas el pipeline de punta a punta.' : pct >= 62 ? 'Buen avance. Revisa las etapas donde fallaste y vuelve a intentarlo.' : 'Recorre las 5 etapas con los controles interactivos y reintenta.'}</p></div>
      <div class="quiz-nav"><button type="button" class="btn" data-q="close">Cerrar</button><button type="button" class="btn btn-hema" data-q="retry">Reintentar</button></div></div>`;
  } else {
    h = `<div class="quiz-card"><div class="quiz-top"><span class="kicker" id="quiz-title">Pregunta ${quiz.i + 1} de ${QUIZ.length}</span><span class="mono" style="font-size:12px;color:var(--ink2)">Puntaje ${quiz.score}</span></div>
      <div class="quiz-prog"><div style="width:${(quiz.i + (quiz.answered ? 1 : 0)) / QUIZ.length * 100}%"></div></div>
      <p class="quiz-q">${Q.q}</p>
      ${Q.o.map((t, i) => { let c = ''; if (quiz.answered) c = i === Q.c ? 'ok' : (i === quiz.sel ? 'no' : ''); return `<button type="button" class="quiz-opt ${c}" data-qopt="${i}" ${quiz.answered ? 'disabled' : ''}><span class="lt">${L[i]}</span><span>${t}</span></button>`; }).join('')}
      ${quiz.answered ? `<div class="quiz-fb ${quiz.sel === Q.c ? 'ok' : 'no'}"><b>${quiz.sel === Q.c ? 'Correcto.' : 'No es esa.'}</b> ${Q.e}</div>` : ''}
      <div class="quiz-nav"><button type="button" class="btn" data-q="close">Salir</button>${quiz.answered ? `<button type="button" class="btn btn-hema" data-q="next">${quiz.i === QUIZ.length - 1 ? 'Ver resultado' : 'Siguiente'}</button>` : '<span></span>'}</div></div>`;
  }
  m.innerHTML = h;
  const f = m.querySelector('.btn-hema, .quiz-opt:not([disabled])'); if (f) f.focus({ preventScroll: true });
}
function bindQuiz() {
  $('#quiz-modal').addEventListener('click', e => {
    if (e.target.id === 'quiz-modal') return closeQuiz();
    const o = e.target.closest('[data-qopt]');
    if (o && !quiz.answered) { quiz.sel = +o.dataset.qopt; quiz.answered = true; if (quiz.sel === QUIZ[quiz.i].c) quiz.score++; renderQuiz(); return; }
    const b = e.target.closest('[data-q]'); if (!b) return;
    if (b.dataset.q === 'close') closeQuiz();
    else if (b.dataset.q === 'retry') { quiz = { i: 0, score: 0, answered: false, sel: -1, done: false }; renderQuiz(); }
    else if (b.dataset.q === 'next') { if (quiz.i === QUIZ.length - 1) quiz.done = true; else { quiz.i++; quiz.answered = false; quiz.sel = -1; } renderQuiz(); }
  });
}

/* =====================================================================
   21. BUCLE PRINCIPAL Y ARRANQUE
   ===================================================================== */
const clock = new THREE.Clock();
function processDirty(force) {
  if (dirty.composite) { dirty.composite = false; rebuildCompositeTexture(); dirty.pyramidTex = true; dirty.sidebarLive = true; world.s3.hospKey = ''; }
  if (dirty.tiles) { dirty.tiles = false; computeTileInfos(); applyTileStates(); refreshPinned(); dirty.sidebarLive = true; }
  if (dirty.tilesVisual) { dirty.tilesVisual = false; applyTileStates(); }
  if (dirty.bag) { dirty.bag = false; computeBag(); dirty.mil = true; }
  if (dirty.mil) { dirty.mil = false; computeMIL(); applyMILVisuals(); dirty.heat = true; dirty.sidebarLive = true; }
  if (dirty.umap) { dirty.umap = false; updateUmapTargets(); applyUmapColors(); dirty.sidebarLive = true; dirty.legend = true; }
  if (state.stage === 5 && dirty.heat) { dirty.heat = false; computeHeatField(); }
  if (state.stage === 5 && dirty.heatColor) { colorizeHeat(); applyHeatVisibility(); }
  if (state.stage === 5 && dirty.top3Thumbs) drawTop3Thumbs();
  if (state.stage === 1 && dirty.pyramidTex) refreshPyramidTextures();
  if (dirty.legend) { dirty.legend = false; updateLegend(); }
  if (dirty.sidebarLive) { dirty.sidebarLive = false; updateSidebarLive(); updateHUD(); updateBanner(); }
}
let liveTick = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  processDirty();
  stepCamTween(dt); controls.update();
  const n = state.stage;
  if (n === 1) animateStage1(dt, t);
  else if (n === 2) animateStage2(dt, t);
  else if (n === 3) { stepStage3(dt, t); liveTick += dt; if (liveTick > 0.12) { liveTick = 0; dirty.sidebarLive = true; } }
  else if (n === 4) animateStage4(dt, t);
  else if (n === 5) animateStage5(dt, t);
  if (hoverDirty || n === 2) { if (pointerIn) runHover(); hoverDirty = false; }
  renderer.render(scene, camera);
}
function initApp() {
  const host = $('#gl-host');
  try { initThree(host); } catch (err) { showFatal(err); return; }
  generateBaseModalityCanvas(state.modality, baseCanvas);
  rebuildCompositeTexture(); rebuildSlideLabelTexture();
  buildStage1(); buildStage2(); buildStage3(); buildStage4(); buildStage5();
  bindEvents(); bindQuiz();
  setStage(1, true);
  processDirty();
  resizeRenderer();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { rebuildSlideLabelTexture(); dirty.sidebarLive = true; });
  animate();
  window.__pdia = { state, world, dirty, setState, setStage, processDirty, MODALITIES, evalTile, computeMIL, rocAt };   // utilidad de depuración
}
function bootApp() {
  try { initApp(); } catch (err) { showFatal(err); }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootApp); else bootApp();
</script>
